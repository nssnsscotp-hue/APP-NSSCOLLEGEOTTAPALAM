<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSS College Ottapalam - Privacy & Data Governance</title>
    <meta name="description" content="Official Privacy Policy, Account Deletion, and Content Deletion request portal for the NSS College Ottapalam mobile application." />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="NSS College Ottapalam - Privacy & Data Governance" />
    <meta property="og:description" content="Official Privacy Policy, Account Deletion, and Content Deletion request portal for the NSS College Ottapalam mobile application." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="college-logo.png" />
    <link rel="apple-touch-icon" href="nss-crest.jpg" />

    <!-- Google Fonts for crisp academic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/app.css">
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    
    <!-- Static GitHub Pages Fallback: Auto-loads compiled bundle if raw source index.html is served -->
    <script>
      (function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            if (!document.querySelector('link[href*="app.css"]')) {
              var css = document.createElement('link');
              css.rel = 'stylesheet';
              css.href = './assets/app.css';
              document.head.appendChild(css);
            }

            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = './assets/app.js';
            document.body.appendChild(script);

            setTimeout(function() {
              if (root && root.children.length === 0) {
                var p = window.location.pathname;
                if (!p.includes('/docs')) {
                  var target = (p.endsWith('/') ? p : p + '/') + 'docs/' + window.location.hash;
                  window.location.replace(target);
                }
              }
            }, 800);
          }
        }, 150);
      })();
    </script>
  </body>
</html>
